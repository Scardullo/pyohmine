format = """
[](#3B4252)\
$python\
$username\
[](bg:#434C5E fg:#3B4252)\
$directory\
[](bg:#83a598 fg:#434C5E)\
$git_branch\
$git_status\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$docker_context\
$time\
[ ](fg:#83a598)\
"""

command_timeout = 5000

# Disable the blank line at the start of the prompt
# add_newline = false

[username]
show_always = true
style_user = "bg:#3B4252"
style_root = "bg:#3B4252"
format = '[ ]($style)'

[directory]
style = "bg:#434C5E"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[c]
symbol = " "
style = "fg:#ffffff bg:#83a598"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#83a598"
format = '[ $symbol $context ]($style)$path'

[elixir]
symbol = " "
style = "bg:#83a598"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#83a598"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#83a598"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#83a598"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#83a598"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#83a598"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#83a598"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#83a598"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#83a598"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:#83a598"
format = '[ $symbol ($version) ]($style)'

[python]
style = "bg:#3B4252"
format = '[(\($virtualenv\) )]($style)'

[rust]
symbol = ""
style = "bg:#83a598"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#83a598"
format = '[ $time ]($style)'
